on:
  push:
    branches: [main]
permissions:
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Authorize
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/experimentf/doodle-server:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST_PATH }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ghcr.io/experimentf/doodle-server:${{ github.sha }}
            docker stop doodle-server || true
            docker rm doodle-server || true
            docker run -d --name doodle-server --restart unless-stopped -p 5000:5000 --env-file /root/doodle-server/.env.production ghcr.io/experimentf/doodle-server:${{ github.sha }}
